name: CI

on: [push, pull_request]

# Nothing here publishes anything, so the token gets nothing beyond the checkout.
permissions:
  contents: read

# Third-party actions are pinned to a commit, with the version in the comment. A tag can be
# moved; a commit cannot, and these run with a token in a workflow that builds the binary two
# hosts are pointed at. Updating one means reading what changed, which is the point.

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # The filter keeps the tested surface Linux-only. Note it is not a workaround: a
      # solution-level build here would compile the WMI adapter fine. The boundary is held by
      # HexagonalBoundaryTests, and by NU1201 if the Domain ever targets Windows.
      # The whole solution, not only the filter. CLAUDE.md states as a guarantee that the
      # Windows projects compile off Windows; during milestone 3 that was false for seventeen
      # commits and nothing noticed, because the Linux filter excludes the WMI project and
      # stayed green throughout. This line is what turns the written guarantee into a checked
      # one. It compiles the adapter; it does not pretend to test it.
      - name: Compile every project, the Windows ones included
        run: dotnet build Ripcord.sln -c Release

      - name: Build the Linux surface
        run: dotnet build Ripcord.Linux.slnf -c Release

      - name: Run the tests
        run: dotnet test Ripcord.Linux.slnf -c Release --logger trx

      - name: Keep the test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'

  # install.ps1 cannot be run by the xUnit suite, and it cannot be run on the machine it was
  # written on either — there is no PowerShell there. This job is the only thing that executes
  # it, which is why it runs on every push rather than at release time, when finding out would
  # be too late.
  installer:
    name: Verify the installer
    runs-on: windows-latest
    # Nothing here should take five minutes. Without a bound, a step that stops to ask a
    # question on a runner with no keyboard waits six hours before anybody is told.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A throwaway key pair, generated fresh. The real signing key stays in the release
      # workflow's secret: this job runs on every push, and the refusals it checks — a wrong
      # signer, a flipped byte, an absent signature — need a key, not *the* key.
      - name: Generate the signature fixtures
        shell: pwsh
        run: ./tests/install/New-SignatureVectors.ps1 -Destination "$env:RUNNER_TEMP/vectors"

      - name: Run the installer tests under PowerShell 7
        shell: pwsh
        env:
          RIPCORD_SIGNATURE_VECTORS: ${{ runner.temp }}/vectors
        run: Invoke-Pester -CI -Output Detailed tests/install/Install.Tests.ps1

      # The same file again under Windows PowerShell 5.1, which is what a Hyper-V host has and
      # what the operator will paste the one-liner into. It verifies by a different route —
      # neither ImportFromPem nor a DER-aware VerifyData exists there — so a suite that only
      # ran under 7 would leave the path that matters unexecuted.
      - name: Run the installer tests under Windows PowerShell 5.1
        shell: powershell
        env:
          RIPCORD_SIGNATURE_VECTORS: ${{ runner.temp }}/vectors
        run: |
          # Windows PowerShell draws a progress bar even with nowhere to draw it, and on a
          # module download that costs minutes rather than seconds. It is most of why this
          # step used to sit silent long enough to look wedged.
          $ProgressPreference = 'SilentlyContinue'

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Write-Host 'installing Pester from the PowerShell Gallery'

          # Trusted first, and -Confirm:$false after. An untrusted repository asks before it
          # installs, and a question asked where there is no keyboard is the one way this step
          # can genuinely hang rather than merely be slow.
          Install-PackageProvider -Name NuGet -Force -Scope CurrentUser -Confirm:$false | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck `
            -Scope CurrentUser -AllowClobber -Confirm:$false

          Import-Module Pester -MinimumVersion 5.5.0

          # Which Pester actually loaded: 5.1 ships 3.4.0 in System32 and it wins on load
          # order more often than anyone expects.
          Write-Host "Pester $((Get-Module Pester).Version) under $($PSVersionTable.PSVersion)"

          Invoke-Pester -CI -Output Detailed tests/install/Install.Tests.ps1

  # The Dockerfile is the documented local way to run the tests. Building it here keeps it
  # from rotting unnoticed.
  container:
    name: Build the test container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the image the Dockerfile describes
        run: docker build -t ripcord-tests .
