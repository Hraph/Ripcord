name: release

# Tags only, never a branch push. A release is a deliberate act: the version comes from the
# tag, so there is no path by which merging something publishes a binary.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The real target platform. The Windows projects do compile on Linux, but a release
    # binary is not the place to rely on that: this is the one artefact nobody can rebuild
    # from the host it fails on.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink needs the full history to stamp a commit into InformationalVersion,
          # and `ripcord version` is what tells an operator which binary is on which host.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Take the version from the tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "tag '${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      # The gate. A tag does not make a broken build releasable, and the whole solution is
      # compiled here — not only the Linux filter — because the WMI adapter ships in this
      # binary and nothing else ever checks that it builds.
      - run: dotnet build Ripcord.sln -c Release
      - run: dotnet test Ripcord.Linux.slnf -c Release

      - name: Publish the single self-contained binary
        run: >
          dotnet publish src/Ripcord.Host.Windows/Ripcord.Host.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o publish

      # No Authenticode signature yet — that needs a paid certificate. Until then a checksum
      # is the only way an operator can tell that the file on the host is the file that was
      # built here, so it ships with the release rather than being available on request.
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/ripcord.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ripcord.exe" | Out-File -Encoding ascii publish/ripcord.exe.sha256
          Write-Host $hash

      # The release page has to say what is in this release *and* how to put it on a pair that
      # cannot be failed over halfway through. The first comes from CHANGELOG.md, which is
      # written by hand because it states what is still unverified; the second is the standing
      # text in RELEASE_NOTES.md. A tag whose version has no changelog section fails here — the
      # same gate `scripts/release.sh` applies before the tag exists, repeated because a tag can
      # also be pushed without that script.
      - name: Assemble the release notes
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          # The heading carries the date, so the version is matched as a whole word at the
          # start of it rather than as the whole line.
          $heading = '^##\s+' + [regex]::Escape($env:VERSION) + '([^0-9.]|$)'
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $heading) { $start = $i; break }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md has no '## $env:VERSION' section"
          }
          $rest = $lines[($start + 1)..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $notes = @("## What is in ${env:VERSION}") + $body + @("") + (Get-Content docs/RELEASE_NOTES.md)
          $notes | Out-File -Encoding utf8 release-notes.md

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          publish/ripcord.exe publish/ripcord.exe.sha256
          --title "ripcord ${{ env.VERSION }}"
          --notes-file release-notes.md
          --verify-tag
