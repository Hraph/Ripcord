# Ripcord configuration for the DR host. The primary's file is the mirror image of this one:
# the node and peer blocks are swapped. Copying this file across without swapping them is
# refused at startup, by name.
schema_version: 1

node:
  hostname: HV-REPLICA-01
  host_memory_reserve_gb: 4

peer:
  hostname: HV-PRIMARY-01
  address: 192.0.2.11
  # How long the peer must stay silent before Ripcord calls it offline. Not a socket timeout.
  offline_after_sec: 120

replication:
  port: 443
  auth: certificate
  local_certificate_subject: "CN=HV-REPLICA-01"
  peer_certificate_subject: "CN=HV-PRIMARY-01"
  expected_switch_name: vSwitch-PROD
  expected_frequency_sec: 30
  lag_warning_multiplier: 3

# The read-only pair channel. Remove this block entirely, or set enabled: false, and the node
# degrades to the local-only view rather than failing.
listener:
  enabled: true
  port: 7443
  local_certificate_thumbprint: "AAAA1111BBBB2222CCCC3333DDDD4444EEEE5555"
  peer_certificate_thumbprint: "1111AAAA2222BBBB3333CCCC4444DDDD5555EEEE"
  # Written by `ripcord status`, served by the listener. The service account gets read access
  # to this one file and nothing else.
  snapshot_path: "D:\\Ripcord\\state.json"

vms:
  - name: VM-DC-01
    priority: P1
    is_domain_controller: true    # USN rollback guard
    expected_startup_ram_mb: 2048
  - name: VM-LEGACY-01
    priority: P1
    expected_startup_ram_mb: 2048
  - name: VM-BACKUP-01
    priority: P2
    has_passthrough_disk: true    # not replicated by Hyper-V Replica
    expected_startup_ram_mb: 2048

storage:
  data_volume: "D:"
  free_space_warning_gb: 200
  check_bitlocker_autounlock: true

alerts:
  smtp: { enabled: false }
  webhook: { enabled: false }
  quiet_hours: "23:00-07:00"
