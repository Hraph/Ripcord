# Ripcord configuration for the primary host. The DR host's file is the mirror image of this
# one: the node and peer blocks are swapped. Copying this file across without swapping them is
# refused at startup, by name.
schema_version: 1

node:
  hostname: HV-PRIMARY-01
  host_memory_reserve_gb: 4

peer:
  hostname: HV-REPLICA-01
  address: 192.0.2.12
  # How long the peer must stay silent before Ripcord calls it offline. Not a socket timeout.
  offline_after_sec: 120

replication:
  port: 443
  auth: certificate
  local_certificate_subject: "CN=HV-PRIMARY-01"
  peer_certificate_subject: "CN=HV-REPLICA-01"
  # Which side this host normally is. The pair's two files are mirror images, so nothing else
  # says which way round the replication is meant to run — and "the direction is inverted"
  # cannot be answered without it.
  expected_role: primary
  expected_switch_name: vSwitch-PROD
  expected_frequency_sec: 30
  lag_warning_multiplier: 3
  # Where a test failover attaches the test VM. Left out, every adapter of the test VM is
  # started disconnected, which is the safe default. It must never be expected_switch_name:
  # a test VM is a byte-for-byte copy, so on the production switch it is a duplicate
  # hostname, IP and — for the domain controller — a duplicate directory identity.
  # It must also not be an external switch: external is the only kind bridged to a physical
  # NIC, so a second one reaches production just as well. That is checked against the host
  # itself before anything starts, not against this name.
  # test_failover_switch: vSwitch-ISOLATED
  # How long a test VM may exist before it is reported as the residue of an interrupted run.
  # Hyper-V lists test VMs and never mentions them; this is what mentions them. Default 24.
  # test_failover_orphan_after_hours: 24
  # VMs that `ripcord test-failover --unattended` may test with nobody present. This is the
  # one place the typed confirmation is waived, so it is a per-VM authorisation and not a
  # switch: absent, no VM may run unattended. It does not make the run easier — unattended
  # refuses on ANY rule that could not be checked, where an attended run refuses on six.
  # unattended_test_failover_vms:
  #   - VM-LEGACY-01

# The read-only pair channel. Remove this block entirely, or set enabled: false, and the node
# degrades to the local-only view rather than failing.
listener:
  enabled: true
  port: 7443
  local_certificate_thumbprint: "1111AAAA2222BBBB3333CCCC4444DDDD5555EEEE"
  peer_certificate_thumbprint: "AAAA1111BBBB2222CCCC3333DDDD4444EEEE5555"
  # Written by `ripcord status`, served by the listener. Left out, it sits beside this file,
  # with the log and the audit trail. The service account is granted read access to the folder
  # holding it: the snapshot is rewritten by moving a new file over the old one, which would
  # drop an entry set on the file itself.
  # A path with no folder in it is refused: it would resolve against the working directory of
  # whoever runs the command, and a Windows service's is system32.
  # snapshot_path: "D:\\Ripcord\\state.json"

vms:
  - name: VM-DC-01
    priority: P1
    is_domain_controller: true    # USN rollback guard
    expected_startup_ram_mb: 2048
  - name: VM-LEGACY-01
    priority: P1
    expected_startup_ram_mb: 2048
    # Nothing in WMI knows when Microsoft stops shipping patches; this date is the only source.
    guest_os_support_ends: 2026-10-13
  - name: VM-BACKUP-01
    priority: P2
    has_passthrough_disk: true    # not replicated by Hyper-V Replica
    expected_startup_ram_mb: 2048
    # Kept out of --all and --priority sweeps. Not because it would run badly on the other
    # host, but because it boots without its 4 TB repository and can start writing fresh full
    # backups into the target's D: — the volume the failed-over VMs are already living on.
    # Failing it over is still possible; it has to be named.
    failover: manual

# Findings the operator has seen and accepted. Every entry needs a reason and an expiry date:
# without one, an acknowledgement is a rule deleted by the back door. Rules whose violation
# means the service would not come back at all can never be acknowledged.
checks:
  acknowledgements:
    - rule: passthrough-disk-on-replicated-vm
      vm: VM-BACKUP-01
      reason: "the backup repository is a pass-through disk by design; it is not replicated"
      expires: 2027-09-01

storage:
  data_volume: "D:"
  free_space_warning_gb: 200
  check_bitlocker_autounlock: true

# Notification when a critical rule appears. Off by default and genuinely optional: these
# hosts are meant to have no outbound access, and `ripcord check` behaves identically without
# this block. Delete it and nothing notifies anybody.
#
# Only code 1 — a critical rule violated — notifies. Warnings never do, and the notification
# goes out on a transition rather than on every scheduled run.
# alerting:
#   enabled: true
#   # How long the same finding stays quiet before it is mentioned again. Default 24.
#   repeat_after_hours: 24
#   # Local time on this host. An alert raised inside the window is delivered when the window
#   # ends, never dropped.
#   quiet_hours: "22:00-07:00"
#   smtp:
#     host: smtp.example.net
#     port: 587
#     start_tls: true
#     from: ripcord@example.net
#     to:
#       - ops@example.net
#     # The password is never written here. This names the environment variable the service
#     # reads it from; `password:` in this file is refused by name.
#     username: ripcord@example.net
#     password_secret: RIPCORD_SMTP_PASSWORD
#   webhook:
#     url: "https://hooks.example.net/ripcord"

# Whether this host may ask GitHub whether a newer release exists, and whether it may act on
# the answer. Both off, and meant to stay off on a host with no outbound access.
#
# Two switches, because they buy different things. `check` risks a wrong version number on a
# console. `install` lets a published release replace the binary this host runs its failovers
# with — only if its signature verifies against the key compiled into that binary, and only
# after somebody types the node name, but that is the line it crosses. `install` without
# `check` is refused by name.
#
# Updating one host makes the pair disagree, and a failover spanning both is refused while it
# does. Update both, one after the other, and never during an incident.
# updates:
#   check: true
#   install: true

# The read-only page of `ripcord dashboard`, served on 127.0.0.1 and nowhere else. Off, and
# meant to stay off: a disaster recovery tool that opens a listening socket nobody asked for
# has widened the attack surface of a Hyper-V host to save typing a command. There is no
# address key — the page is bound to the loopback interface by construction.
# dashboard:
#   enabled: true
#   port: 7080
#   # Each refresh re-reads Hyper-V. Between 5 and 86400 seconds.
#   refresh_sec: 30

# The diagnostic log. Unlike everything above it, this section is on by default and refuses
# nothing: a value out of range is replaced rather than reported, because a host that will not
# run because its log size is silly is a host with no log and no command either.
#
# What goes in it: every command with its arguments and its exit code, and the full exception
# behind any failure the console only had room for one sentence about. That is the file to send
# when something is wrong on a host nobody can attach a debugger to. Webhook URLs and anything
# whose key names a password or a token are removed on the way in, so it can be sent as it is.
#
# Defaults, applied when this block is absent: `ripcord.log` beside the binary, 5 MB, rotated
# once into `ripcord.log.1` and no further.
# diagnostics:
#   enabled: true
#   path: D:\Ripcord\ripcord.log
#   max_size_mb: 5
